name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate audio manifest
        run: |
          mkdir -p assets/audio
          : > assets/audio/tracks.json
          echo '[' >> assets/audio/tracks.json
          first=1
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            escaped=$(printf '%s' "$file" | sed 's/\\/\\\\/g; s/"/\\"/g')
            if [ "$first" -eq 1 ]; then
              first=0
            else
              echo ',' >> assets/audio/tracks.json
            fi
            printf '  "%s"' "$escaped" >> assets/audio/tracks.json
          done < <(find assets/audio -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.m4a' -o -iname '*.aac' \) | sort)
          echo '' >> assets/audio/tracks.json
          echo ']' >> assets/audio/tracks.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
